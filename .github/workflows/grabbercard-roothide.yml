name: GrabberCard RootHide arm64e
on:
  push:
    branches: [main]
    paths:
      - 'GrabberCardRootHide/**'
      - '.github/workflows/grabbercard-roothide.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Install build tools
        run: |
          brew install dpkg xz
          mkdir -p "$HOME/theos/bin"
          if [ "$(uname -m)" = arm64 ]; then A=ldid_macosx_arm64; else A=ldid_macosx_x86_64; fi
          curl -fsSL --retry 3 --retry-delay 3 "https://github.com/ProcursusTeam/ldid/releases/download/v2.1.5-procursus7/$A" -o "$HOME/theos/bin/ldid"
          chmod +x "$HOME/theos/bin/ldid"
      - name: Verify Apple iOS SDK
        run: |
          xcode-select -p
          xcrun --sdk iphoneos --show-sdk-path
          xcrun --sdk iphoneos --find clang
          xcrun --find lipo
      - name: Build and statically verify RootHide deb
        run: |
          chmod +x GrabberCardRootHide/GrabberCard/build-roothide.sh
          GrabberCardRootHide/GrabberCard/build-roothide.sh
          mkdir -p dist
          cp GrabberCardRootHide/GrabberCard/dist/*.deb dist/
          shasum -a 256 dist/*.deb
      - uses: actions/upload-artifact@v4
        with:
          name: GrabberCard-RootHide-arm64e-${{ github.run_number }}
          path: dist/*.deb
          if-no-files-found: error
